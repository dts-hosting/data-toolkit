# Runs the production image locally for QA.
# For development use the host: `docker compose up -d db` then `bin/dev`.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - RUBY_VERSION=4.0.5
    env_file:
      - .env
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgres://toolkit:toolkit@db:5432/toolkit_qa
      # Ok unset
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:18-alpine
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: toolkit
      POSTGRES_PASSWORD: toolkit
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolkit -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
