default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# Local credentials match the `db` service in docker-compose.yml.
development:
  primary: &primary_development
    <<: *default
    database: toolkit_development
    host: localhost
    username: toolkit
    password: toolkit
  cable:
    <<: *primary_development
    database: toolkit_development_cable
    migrations_paths: db/cable_migrate
  cache:
    <<: *primary_development
    database: toolkit_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
    database: toolkit_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary: &primary_test
    <<: *primary_development
    database: toolkit_test
  cable:
    <<: *primary_test
    database: toolkit_test_cable
    migrations_paths: db/cable_migrate
  cache:
    <<: *primary_test
    database: toolkit_test_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_test
    database: toolkit_test_queue
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cable:
    <<: *default
    url: <%= "#{ENV["DATABASE_URL"]}_cable" %>
    migrations_paths: db/cable_migrate
  cache:
    <<: *default
    url: <%= "#{ENV["DATABASE_URL"]}_cache" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= "#{ENV["DATABASE_URL"]}_queue" %>
    migrations_paths: db/queue_migrate
